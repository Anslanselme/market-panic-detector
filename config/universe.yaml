# Universe of 50 US large caps, grouped into 8 sector groups.
# Chosen with today's knowledge: this introduces survivorship bias (see README).
# Sector ids are translated in src/panic_detector/i18n/*.json under "sector.<id>".

benchmark:
  ticker: SPY
  name: SPDR S&P 500 ETF Trust

# Highlighted on the network and in the price chart, with their signature colours.
leaders: [NVDA, AAPL, MSFT, GOOGL, AMZN, META, TSLA]

sectors:
  - technology
  - communication
  - consumer_discretionary
  - consumer_staples
  - financials
  - healthcare
  - energy_materials
  - industrials_utilities

