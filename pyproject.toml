[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panic-detector"
version = "0.1.0"
description = "Detect market panic regimes from the correlation network of US large caps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panic_detector = ["i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
